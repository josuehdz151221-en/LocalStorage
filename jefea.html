<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Jefe/a</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    
<div class="container mt-4">
    <nav class="navbar navbar-dark bg-primary rounded shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold">Panel Jefe/a</span>
            <div class="d-flex align-items-center">
                <span id="infoUsuario" class="text-white me-3 fw-bold"></span>
                <button class="btn btn-sm btn-danger fw-bold" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <!-- Formulario de registro -->
    <div class="card p-4 shadow-sm mb-4 bg-dark text-white mt-3">
      <form id="formUsuario">
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">ID del Equipo</label>
            <input type="text" id="idequipo" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Tipo de Equipo</label>
            <select id="tequipo" class="form-select" required>
              <option value="">Seleccione</option>
              <option value="Desfibrador">Desfibrador</option>
              <option value="Electrocardiografo">Electrocardiografo</option>
              <option value="Oculista">Oculista</option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-between mt-2">
          <button type="submit" id="btnGuardar" class="btn btn-success">Registrar</button>
          <button type="submit" id="btnActualizar" class="btn btn-warning d-none">Actualizar</button>
          <button type="button" id="btnLimpiar" class="btn btn-danger">Borrar todo</button>
        </div>
      </form>
    </div>

    <!-- Lista de equipos -->
    <h3>📋 Lista de Equipos</h3>
    <div id="listaEquipos" class="mt-3"></div>
  </div>

  <script src="JS/medico.js"></script>
  <script>
    // Proteger la ruta exigiendo el rol 'Jefe/a'
    document.addEventListener('DOMContentLoaded', () => {
        verificarAcceso('Jefes de area');
    });
  </script>
</body>
</html>
