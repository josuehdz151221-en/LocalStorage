<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Enfermero/a</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

  <div class="container mt-4">
   <nav class="navbar navbar-dark bg-primary rounded shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold">Panel Enfermeros</span>
            <div class="d-flex align-items-center">
                <span id="infoUsuario" class="text-white me-3 fw-bold"></span>
                <button class="btn btn-sm btn-danger fw-bold" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <!--Pedir préstamo-->
    <div class="card p-4 shadow-sm mb-4 bg-dark text-white mt-3">
      <h5 class="mb-3">Solicitar Préstamo de Equipo</h5>
      <form id="formPrestamo" class="row g-3 align-items-end">
        <div class="col-md-8">
          <label for="selectEquipoDisponible" class="form-label">Equipos Disponibles</label>
          <select id="selectEquipoDisponible" class="form-select" required>
            <option value="">Elije un equipo disponible</option>
          </select>
        </div>
        <div class="col-md-4">
          <button type="submit" id="btnSolicitarPrestamo" class="btn btn-primary w-100 fw-bold">
            Solicitar préstamo
          </button>
        </div>
      </form>
    </div>

    <!-- Equipos disponibles (vista rápida / tarjetas) -->
    <h3>Equipos Disponibles</h3>
    <div id="listaDisponibles" class="mt-3 mb-4"></div>

    <!-- Préstamos activos (para devolver equipo) -->
    <h3>Préstamos</h3>
    <div id="prestamosActivos" class="mt-3 mb-5"></div>
  </div>

  <script src="JS/medico.js"></script>
  <body>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        verificarAcceso('Enfermeros');
    });
  </script>
  </body>
</body>
</html>
